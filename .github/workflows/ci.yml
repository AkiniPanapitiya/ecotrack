name: EcoTrack CI Pipeline

on:
  push:
    branches: [ "Dev", "Deploy", "deploy", "main" ]
  pull_request:
    branches: [ "Dev", "Deploy", "deploy", "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcoTrack.slnx

      - name: Build all services
        run: dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Run unit tests with code coverage
        run: |
          dotnet test EcoTrack.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Code Coverage Report & Quality Summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline;Cobertura;TextSummary"
          echo "=== Code Coverage Summary ==="
          cat TestResults/CoverageReport/Summary.txt

      - name: Verify Code Coverage Quality Gate
        run: |
          LINE_COV=$(grep -i "Line coverage:" TestResults/CoverageReport/Summary.txt | head -n 1 | awk '{print $3}' | tr -d '%')
          echo "Evaluated Line Coverage: ${LINE_COV}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Failed to parse line coverage metric."
            exit 1
          fi
          echo "Quality Gate check passed: Unit test coverage collected successfully (${LINE_COV}%)."

      - name: Upload test & coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            TestResults/
            TestResults/CoverageReport/
          retention-days: 7

  frontend-build:
    name: Frontend Build (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup .NET 10.0 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build C# services for CodeQL
        if: matrix.language == 'csharp'
        run: |
          dotnet restore EcoTrack.slnx
          dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [ build-and-test, frontend-build ]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dockerfile: src/Identity/Dockerfile
          - service: logistics
            dockerfile: src/Logistics/Dockerfile
          - service: marketplace
            dockerfile: src/Marketplace/Dockerfile
          - service: analytics
            dockerfile: src/Analytics/Dockerfile
          - service: web
            dockerfile: src/apps/web/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build full Docker image
        run: |
          docker build \
            --tag ecotrack-${{ matrix.service }}:${{ github.sha }} \
            --file ${{ matrix.dockerfile }} \
            .