name: EcoTrack CI Pipeline

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcoTrack.slnx

      - name: Build all services
        run: dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: |
          echo "Running tests..."
          dotnet test EcoTrack.slnx --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" || \
          echo "Note: Some tests may not be configured yet — check test project setup"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 5

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Analytics Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-analytics-ci-check \
            --file src/Analytics/Dockerfile \
            .

      - name: Build Identity Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-identity-ci-check \
            --file src/Identity/Dockerfile \
            .

      - name: Build Logistics Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-logistics-ci-check \
            --file src/Logistics/Dockerfile \
            .

      - name: Build Marketplace Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-marketplace-ci-check \
            --file src/Marketplace/Dockerfile \
            .

      - name: Clean up Docker images
        run: |
          docker rmi ecotrack-analytics-ci-check ecotrack-identity-ci-check \
            ecotrack-logistics-ci-check ecotrack-marketplace-ci-check \
            2>/dev/null || true
