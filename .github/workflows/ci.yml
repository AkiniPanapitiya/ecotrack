name: EcoTrack CI Pipeline

on:
  push:
    branches: [ "Dev", "Deploy", "deploy", "main" ]
  pull_request:
    branches: [ "Dev", "Deploy", "deploy", "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcoTrack.slnx

      - name: Build all services
        run: dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Run unit tests with code coverage
        run: |
          dotnet test EcoTrack.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Code Coverage Report & Quality Summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline;Cobertura;TextSummary"
          echo "=== Code Coverage Summary ==="
          cat TestResults/CoverageReport/Summary.txt

      - name: Verify Code Coverage Quality Gate
        env:
          MIN_COVERAGE: 20
        run: |
          LINE_COV=$(grep -i "Line coverage:" TestResults/CoverageReport/Summary.txt | head -n 1 | awk '{print $3}' | tr -d '%')
          echo "Line coverage: ${LINE_COV}%  (minimum allowed: ${MIN_COVERAGE}%)"

          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not read the line coverage number."
            exit 1
          fi

          COV_WHOLE=${LINE_COV%.*}

          if [ "$COV_WHOLE" -lt "$MIN_COVERAGE" ]; then
            echo "::error::Coverage ${LINE_COV}% is below the ${MIN_COVERAGE}% quality gate."
            exit 1
          fi

          echo "### ✅ Coverage gate passed: ${LINE_COV}% (minimum ${MIN_COVERAGE}%)" >> $GITHUB_STEP_SUMMARY

  frontend-build:
    name: Frontend Build (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
  
  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: List services that will be started
        run: docker compose config --services
  
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit NuGet packages (.NET services)
        run: |
          dotnet restore EcoTrack.slnx
          dotnet list EcoTrack.slnx package --vulnerable --include-transitive > nuget-audit.txt 2>&1
          cat nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::warning::Vulnerable NuGet packages found. See dependency-audit-reports."
          fi

      - name: Audit npm packages (React frontend)
        working-directory: src/apps/web
        run: |
          if ! npm audit --audit-level=high > npm-audit.txt; then
            echo "::warning::npm audit found high or critical vulnerabilities. See dependency-audit-reports."
          fi
          cat npm-audit.txt

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            nuget-audit.txt
            src/apps/web/npm-audit.txt
          retention-days: 7

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup .NET 10.0 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build C# services for CodeQL
        if: matrix.language == 'csharp'
        run: |
          dotnet restore EcoTrack.slnx
          dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [ build-and-test, frontend-build ]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dockerfile: src/Identity/Dockerfile
          - service: logistics
            dockerfile: src/Logistics/Dockerfile
          - service: marketplace
            dockerfile: src/Marketplace/Dockerfile
          - service: analytics
            dockerfile: src/Analytics/Dockerfile
          - service: web
            dockerfile: src/apps/web/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build full Docker image
        run: |
          docker build \
            --tag ecotrack-${{ matrix.service }}:${{ github.sha }} \
            --file ${{ matrix.dockerfile }} \
            .