name: EcoTrack CI Pipeline

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcoTrack.slnx

      - name: Build all services
        run: dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Run unit tests with code coverage
        run: |
          dotnet test EcoTrack.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Code Coverage Report & Quality Summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline;Cobertura;TextSummary"
          echo "=== Code Coverage Summary ==="
          cat TestResults/CoverageReport/Summary.txt

      - name: Verify Code Coverage Quality Gate
        run: |
          LINE_COV=$(grep -i "Line coverage:" TestResults/CoverageReport/Summary.txt | head -n 1 | awk '{print $3}' | tr -d '%')
          echo "Evaluated Line Coverage: ${LINE_COV}%"
          # Quality Gate verification
          if [ -z "$LINE_COV" ]; then
            echo "::error::Failed to parse line coverage metric."
            exit 1
          fi
          echo "Quality Gate check passed: Unit test coverage collected successfully (${LINE_COV}%)."

      - name: Upload test & coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            TestResults/
            TestResults/CoverageReport/
          retention-days: 7

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup .NET 10.0 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build C# services for CodeQL
        if: matrix.language == 'csharp'
        run: |
          dotnet restore EcoTrack.slnx
          dotnet build EcoTrack.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Analytics Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-analytics-ci-check \
            --file src/Analytics/Dockerfile \
            .

      - name: Build Identity Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-identity-ci-check \
            --file src/Identity/Dockerfile \
            .

      - name: Build Logistics Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-logistics-ci-check \
            --file src/Logistics/Dockerfile \
            .

      - name: Build Marketplace Docker image (dev stage)
        run: |
          docker build \
            --target build \
            --tag ecotrack-marketplace-ci-check \
            --file src/Marketplace/Dockerfile \
            .

      - name: Clean up Docker images
        run: |
          docker rmi ecotrack-analytics-ci-check ecotrack-identity-ci-check \
            ecotrack-logistics-ci-check ecotrack-marketplace-ci-check \
            2>/dev/null || true
