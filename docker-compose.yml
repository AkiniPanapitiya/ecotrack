# ========================================================
# EcoTrack Docker Compose
# ====================================================

services:
  # ============================================================
  # Identity (Port 5001)
  # Owner: Akini (IT24610790)
  identity:
    build:
      context: .
      dockerfile: src/Identity/Dockerfile
    container_name: ecotrack-identity
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5001
      - ConnectionStrings__IdentityDb=Server=ecotrack-db;Database=ecotrack_identity_db;Uid=root;Pwd=root123;
      - Kafka__BootstrapServers=kafka:9092
    networks:
      - ecotrack-network
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/identity/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ====================================================
  # Logistics (Port 5002)
  # Owner: Diloosha (IT24610798)
  # ============================================================
  logistics:
    build:
      context: .
      dockerfile: src/Logistics/Dockerfile
    container_name: ecotrack-logistics
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5002
      - ConnectionStrings__LogisticsDatabase=Server=ecotrack-db;Database=ecotrack_logistics_db;Uid=root;Pwd=root123;
      - Kafka__BootstrapServers=kafka:9092
    networks:
      - ecotrack-network
    depends_on:
      - kafka
      - identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/logistics/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ================================================
  # Marketplace (Port 5003)
  # Owner: sahesi (IT24610783)
  # ====================================================
  marketplace:
    build:
      context: .
      dockerfile: src/Marketplace/Dockerfile
    container_name: ecotrack-marketplace
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5003
      - ConnectionStrings__DefaultConnection=Server=ecotrack-db;Database=ecotrack_marketplace_db;Uid=root;Pwd=root123;
      - Kafka__BootstrapServers=kafka:9092
    networks:
      - ecotrack-network
    depends_on:
      - kafka
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/marketplace/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================
  # Analytics(Port 5004)
  # Owner: dilanka (IT24610796)
  # ==================================================
  analytics:
    build:
      context: .
      dockerfile: src/Analytics/Dockerfile
    container_name: ecotrack-analytics
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5004
      - ConnectionStrings__DefaultConnection=Server=ecotrack-db;Database=ecotrack_analytics_db;Uid=root;Pwd=root123;
      - Kafka__BootstrapServers=kafka:9092
    networks:
      - ecotrack-network
    depends_on:
      - kafka
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5004/analytics/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Kafka
  kafka:
    image: apache/kafka:3.8.0
    container_name: ecotrack-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=ecotrack-cluster-001
    networks:
      - ecotrack-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Kafka Topic Provisioner (Sprint 3 Topics & DLQs)
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: ecotrack-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ecotrack-network
    volumes:
      - ./scripts/init-kafka-topics.sh:/init-kafka-topics.sh
    entrypoint: ["/bin/bash", "/init-kafka-topics.sh"]
    restart: "no"

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ecotrack-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - db-data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - ecotrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Prometheus Monitoring Server (Port 9090)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecotrack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - ecotrack-network
    restart: unless-stopped

  # Grafana Dashboard (Port 3000)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecotrack-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ecotrack-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ecotrack-network
    depends_on:
      - prometheus
    restart: unless-stopped

# Networks
networks:
  ecotrack-network:
    driver: bridge

# Volumes
volumes:
  kafka-data:
    driver: local
  db-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

